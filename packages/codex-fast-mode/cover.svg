<style>svg{--plate:#ffffff;--hi:#232327;--edge:#a4a4ac;--mid:#c3c3c9;--lo:#e0e0e4;--cap:#6e6e76;}@media (prefers-color-scheme:dark){svg{--plate:#08090a;--hi:#d0d6e0;--edge:#5b5d64;--mid:#3e3e44;--lo:#29292d;--cap:#8a8f98;}}.bg{fill:var(--plate);stroke:var(--lo)}.fig path,.fig circle{fill:var(--plate);stroke:var(--mid);stroke-width:1;stroke-linejoin:round;stroke-linecap:round}.fig .nf{fill:none}.fig .sil,.fig .edge{stroke:var(--edge)}.fig .hi{stroke:var(--hi)}.fig .lo{stroke:var(--lo)}.fig .dash{stroke-dasharray:2 4}.fig .dot{stroke:none;fill:var(--hi)}.fig .dot.m{fill:var(--edge)}.fig .dot.off{fill:var(--lo)}text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.tx{fill:var(--edge)}.tx.hi{fill:var(--hi)}.name{fill:var(--hi);font-size:16px;font-weight:600}.kind{fill:var(--edge);font-size:11px;letter-spacing:.08em}.desc{fill:var(--cap);font-size:12.5px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}@keyframes march{to{stroke-dashoffset:-12}}@keyframes tw{0%,100%{opacity:1}50%{opacity:.15}}.fig .march{animation:march .9s linear infinite}@keyframes cv{0%,39.99%{opacity:1}40%,100%{opacity:0}}.cv0{animation:cv 1s linear -1s infinite both}.cv1{opacity:0}.cv1{animation:cv 1s linear -0.8s infinite both}.cv2{opacity:0}.cv2{animation:cv 1s linear -0.6s infinite both}.cv3{opacity:0}.cv3{animation:cv 1s linear -0.4s infinite both}.cv4{opacity:0}.cv4{animation:cv 1s linear -0.2s infinite both}@media (prefers-reduced-motion:reduce){:root .fig,:root .fig *{animation:none}}</style>
