name: Claude MCP bridge Windows stdio

on:
  push:
    branches: [fix/issue-5-windows]
  pull_request:
    paths:
      - "packages/claude-mcp-bridge/**"
      - ".github/workflows/claude-mcp-bridge-windows.yml"

jobs:
  large-stdio-request:
    runs-on: windows-2022
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: pnpm install --lockfile=false --ignore-scripts
      - run: pnpm --filter @ryan_nookpi/pi-extension-claude-mcp-bridge add @modelcontextprotocol/client@2.0.0 --lockfile=false --ignore-scripts
      - run: node -p "require('./packages/claude-mcp-bridge/node_modules/@modelcontextprotocol/client/package.json').version"
      - run: pnpm exec vitest run packages/claude-mcp-bridge/integration.test.ts -t "delivers large tool arguments"
