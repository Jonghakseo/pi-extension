name: Claude MCP bridge stdio matrix

on:
  push:
    branches: [fix/issue-5-windows]
  pull_request:
    paths:
      - "packages/claude-mcp-bridge/**"
      - ".github/workflows/claude-mcp-bridge-windows.yml"

jobs:
  large-stdio-request:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [windows-2022, windows-2025, ubuntu-24.04, macos-15]
        node-version: [20, 22]
        sdk-version: ["2.0.0", "latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: pnpm install --lockfile=false --ignore-scripts
      - run: pnpm --filter @ryan_nookpi/pi-extension-claude-mcp-bridge add @modelcontextprotocol/client@${{ matrix.sdk-version }} --lockfile=false --ignore-scripts
      - run: node -p "require('./packages/claude-mcp-bridge/node_modules/@modelcontextprotocol/client/package.json').version"
      - run: pnpm run typecheck
      - run: pnpm exec vitest run packages/claude-mcp-bridge/integration.test.ts -t "delivers large tool arguments"
      - name: Timed-out requests are not delivered after resume
        run: pnpm exec vitest run packages/claude-mcp-bridge/integration.test.ts -t "does not execute an expired"
